<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Make an Album Suggestion — Dylan's One a Day</title>
<link rel="stylesheet" href="style.css?v=5">
<style>
.suggestion-page{max-width:760px;margin:0 auto;padding:56px 24px 72px}
.suggestion-page h2{font-size:clamp(2.8rem,7vw,5.5rem);line-height:.9;margin:10px 0 16px}
.suggestion-intro{max-width:620px;font-size:17px;line-height:1.55;margin-bottom:34px}
.suggestion-form{display:grid;gap:20px}
.suggestion-field{display:grid;gap:8px}
.suggestion-field label{font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.suggestion-field input,.suggestion-field textarea{width:100%;box-sizing:border-box;border:1px solid rgba(20,20,20,.25);border-radius:10px;background:#fff;padding:13px 14px;font:inherit}
.suggestion-field textarea{min-height:150px;resize:vertical}
.suggestion-submit{justify-self:start;border:0;border-radius:999px;background:var(--ink);color:#fff;padding:13px 22px;font-weight:900;cursor:pointer}
.suggestion-back{display:inline-block;margin-top:28px;color:var(--ink);font-size:12px;font-weight:900;text-decoration:none}
.suggestion-back:hover{text-decoration:underline}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <p class="eyebrow">Dylan's One a Day</p>
    <h1>Make an Album Suggestion</h1>
    <p class="subtitle">Know an album Dylan should hear?</p>
  </div>
</header>
<main>
  <section class="suggestion-page">
    <p class="eyebrow">ALBUM SUGGESTION</p>
    <h2>Put one on the list.</h2>
    <p class="suggestion-intro">Send Dylan an album you think belongs on One a Day. Add your name, the album and artist, and anything else you want him to know.</p>
    <form class="suggestion-form" action="#" method="post" onsubmit="return false;">
      <div class="suggestion-field"><label for="name">Your name</label><input id="name" name="name" type="text" autocomplete="name" required></div>
      <div class="suggestion-field"><label for="album">Album recommendation</label><input id="album" name="album" type="text" required></div>
      <div class="suggestion-field"><label for="artist">Artist</label><input id="artist" name="artist" type="text" required></div>
      <div class="suggestion-field"><label for="note">Note</label><textarea id="note" name="note" placeholder="Why should Dylan listen to it?"></textarea></div>
      <button class="suggestion-submit" type="submit">Send Suggestion</button>
    </form>
    <a class="suggestion-back" href="./">← Back to Dylan's One a Day</a>
  </section>
</main>
<footer>Dylan's One a Day</footer>
</body>
</html>
