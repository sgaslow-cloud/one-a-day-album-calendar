name: Fix pryme cover
on:
  push:
    paths:
      - '.github/workflows/fix-pryme-cover.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add verified cover reference
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('script.js')
          s=p.read_text()
          old='"2026-10-11":{title:"cross the line",artist:"pryme!",genre:"Hyperpop",rating:"8.1",track:"Cross the line",release:"October 2, 2026",tracks:"13",length:"42 min",recommended:"Gabe F",singles:["cross the line","don\'t matter","facetime","love me now"],cover:null,'
          new=old[:-10]+'cover:"https://cdn.albumoftheyear.org/album/2046822-pryme-cross-the-line.jpg",'
          if old not in s: raise SystemExit('target entry not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js
          git commit -m 'Complete October 11 album artwork'
          git push
