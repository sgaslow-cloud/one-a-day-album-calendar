<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>One A Day Album Calendar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div>
    <p class="eyebrow">MUSIC • EVERY DAY</p>
    <h1>One A Day Album Calendar</h1>
    <p class="subtitle">One album. One day. A running record of what we listened to.</p>
  </div>
  <div class="month-controls">
    <button id="prevMonth" aria-label="Previous month">‹</button>
    <strong id="monthLabel"></strong>
    <button id="nextMonth" aria-label="Next month">›</button>
  </div>
</header>
<main class="layout">
  <section class="calendar-card">
    <div class="calendar-head">
      <div class="weekdays"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
    </div>
    <div id="calendar" class="calendar"></div>
  </section>
  <aside class="detail-card" id="detail"></aside>
</main>
<footer>One A Day Album Calendar</footer>
<script src="script.js"></script>
</body>
</html>
